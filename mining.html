<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining Detection | NightLight Economy</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <canvas id="particles"></canvas>
    
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <span class="logo-icon">🛰️</span>
                <span class="logo-text">NightLight<span class="highlight">Economy</span></span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="analysis.html" class="nav-link">Analysis</a>
                <a href="compare.html" class="nav-link">Compare</a>
                <a href="about.html" class="nav-link">About</a>
            </div>
            <button class="btn-primary" id="scanBtn">Start Scan</button>
        </div>
    </nav>

    <main class="mining-container" style="padding: 7rem 2rem 2rem; max-width: 1600px; margin: 0 auto;">
        <div class="page-header">
            <h1 class="page-title">⛏️ Illegal Mining Detection</h1>
            <p class="page-subtitle">AI-powered anomaly detection in protected areas</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem;">
            <!-- Controls -->
            <div class="glass-panel" style="padding: 1.5rem;">
                <h3 style="margin-bottom: 1rem;">🎯 Detection Parameters</h3>
                
                <label style="display: block; margin-bottom: 0.5rem; color: #CBD5E1;">Target Area</label>
                <select id="miningArea" style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white;">
                    <option>Jharkhand Forest Region</option>
                    <option>Chhattisgarh Mining Belt</option>
                    <option>Odisha Coastal Areas</option>
                </select>

                <label style="display: block; margin-bottom: 0.5rem; color: #CBD5E1;">Sensitivity</label>
                <input type="range" min="1" max="10" value="7" style="width: 100%; margin-bottom: 1.5rem;">

                <button id="detectBtn" style="width: 100%; padding: 1rem; background: linear-gradient(135deg, #F59E0B, #EF4444); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">
                    🔍 Detect Anomalies
                </button>

                <div id="detectionResults" style="margin-top: 1.5rem; display: none;">
                    <h4 style="color: #F59E0B; margin-bottom: 1rem;">⚠️ Alerts Found</h4>
                    <div style="background: rgba(245, 158, 11, 0.1); border-left: 3px solid #F59E0B; padding: 1rem; border-radius: 8px; margin-bottom: 0.75rem;">
                        <strong>Location: 23.5°N, 85.3°E</strong>
                        <p style="font-size: 0.9rem; color: #CBD5E1;">Brightness spike: +215%</p>
                    </div>
                    <div style="background: rgba(245, 158, 11, 0.1); border-left: 3px solid #F59E0B; padding: 1rem; border-radius: 8px;">
                        <strong>Location: 23.7°N, 85.1°E</strong>
                        <p style="font-size: 0.9rem; color: #CBD5E1;">Brightness spike: +189%</p>
                    </div>
                </div>
            </div>

            <!-- Map -->
            <div class="glass-panel" style="padding: 1.5rem; height: 600px;">
                <div id="miningMap" style="width: 100%; height: 100%; border-radius: 12px;"></div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/particles.js"></script>
    <script>
        // Mining map
        const miningMap = L.map('miningMap').setView([23.6102, 85.2799], 8);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(miningMap);
        
        document.getElementById('detectBtn').addEventListener('click', function() {
            document.getElementById('detectionResults').style.display = 'block';
            showToast('🔍 Scanning for anomalies...', 'info');
            
            setTimeout(() => {
                L.marker([23.5, 85.3]).addTo(miningMap)
                    .bindPopup('<strong>⚠️ Alert</strong><br>Suspicious activity detected').openPopup();
                L.marker([23.7, 85.1]).addTo(miningMap)
                    .bindPopup('<strong>⚠️ Alert</strong><br>Brightness anomaly');
                showToast('⚠️ 2 anomalies detected!', 'warning');
            }, 2000);
        });
    </script>
</body>
</html>
